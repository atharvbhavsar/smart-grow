# ============================================================
# SMARTLYGROW PRODUCTION NGINX CONFIGURATION
# High-Performance Reverse Proxy, Keep-Alive, Gzip & Caching
# ============================================================

upstream nextjs_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name smartlygrow.in www.smartlygrow.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartlygrow.in www.smartlygrow.in;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/smartlygrow.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartlygrow.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root Directory
    root /var/www/smartlygrow/public;

    # 1. GZIP Compression (Text, CSS, JS, JSON, SVG only — NEVER compress video)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 2. Next.js Static Chunks (Immutable 1-Year Cache)
    location /_next/static/ {
        alias /var/www/smartlygrow/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Public Static Assets (Images, Favicons, Manifest)
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @proxy;
    }

    # 4. Next.js Application & API Reverse Proxy
    location / {
        try_files $uri @proxy;
    }

    location @proxy {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # Keep-Alive connection pooling
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer Configuration
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
